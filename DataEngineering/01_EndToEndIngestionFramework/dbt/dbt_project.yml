# Name your project! Project names should contain only lowercase characters
# and underscores. This represents your internal code package namespace.
name: 'traffic_data_pipeline'
version: '1.0.0'
config-version: 2

profile: 'profile_traffic'


model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"  
clean-targets:        
  - "target"
  - "dbt_packages"


# Sets structural defaults across your Medallion layers. Staging and Intermediate 
# models default to lightweight views, while final Gold Marts materialize as high-
# performance physical tables in Snowflake.

models:
  live_traffic_platform:
    
    # Bronze Layer: Flattened variant views with initial explicit casting
    01_staging:
      +materialized: view
      
    # Silver Layer: Cleansed, deduplicated, and parsed intermediate datasets
    02_intermediate:
      +materialized: view
      
    # Gold Layer: Enforced contracts, star schemas, and dimensional models for BI
    03_marts:
      +materialized: table