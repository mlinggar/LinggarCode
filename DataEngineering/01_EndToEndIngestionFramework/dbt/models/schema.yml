version: 2

models:
  - name: dim_routes
    description: "Dimension mapping physical road routes and their base geometries."
    columns:
      - name: route_key
        description: "Primary key hash of the unique route identifier."
        tests:
          - unique
          - not_null
      - name: route_id
        description: "The native alphanumeric ID assigned to the route segment."
      - name: route_name
        description: "The street or highway display name."

  - name: dim_weather_conditions
    description: "Dimension containing distinct weather states and safe fallbacks."
    columns:
      - name: weather_condition_key
        description: "Primary key hash of the weather condition string."
        tests:
          - unique
          - not_null

  - name: dim_osm_assets
    description: "Dimension containing physical point assets (speed cameras, toll gantries) from OpenStreetMap, spatially matched to road segments."
    columns:
      - name: asset_key
        description: "Primary key hash of the unique OpenStreetMap element."
        tests:
          - unique
          - not_null
      - name: route_key
        description: "Foreign key connecting this camera or toll gantry to its parent road segment. Defaults to an unmapped hash if unmatched."
        tests:
          - not_null
      - name: osm_id
        description: "The native OpenStreetMap internal numeric identifier."
        tests:
          - unique
          - not_null

  - name: fact_travel_times
    description: "Incremental fact table recording real-time traffic speeds matched with hourly weather conditions."
    columns:
      - name: telemetry_event_key
        description: "Primary key hash combining route identity and exact observation timestamp."
        tests:
          - unique
          - not_null
      - name: route_key
        description: "Foreign key linking the telemetry event to dim_routes."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_routes')
                field: route_key
      - name: weather_condition_key
        description: "Foreign key linking the telemetry event to dim_weather_conditions. Defaults to an Unknown hash if weather logs are delayed."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_weather_conditions')
                field: weather_condition_key
      - name: observation_timestamp
        description: "The raw date and time when the traffic snapshot was logged."
        tests:
          - not_null

  - name: vw_live_traffic_map
    description: "A live, unified reporting view that uses a horizontal LEFT JOIN to enrich real-time road segment speeds directly with nearby OpenStreetMap assets."
    columns:
      # Core Route Identifiers
      - name: route_key
        description: "The primary hashed key identifying the physical road segment. Note: This can duplicate if a route contains multiple assets."
        tests:
          - not_null
      - name: display_name
        description: "The human-readable name of the highway or street segment (e.g., E4 Highway)."
        tests:
          - not_null

      # Live Traffic & Telemetry Data
      - name: traffic_status
        description: "Real-time traffic flow status calculated from travel times."
      - name: live_speed_kmh
        description: "The current average driving speed captured on the segment in kilometers per hour."
      - name: current_weather
        description: "The active weather condition surrounding the route segment."
      - name: last_updated_at
        description: "The exact timestamp of the latest traffic telemetry payload window."
        tests:
          - not_null

      # Enriched OpenStreetMap Asset Attributes (Joined Horizontally)
      - name: asset_id
        description: "The native OpenStreetMap internal ID for the matching point structure. Returns NULL if no asset is on the road."
      - name: asset_name
        description: "The localized label or name of the physical asset."
      - name: asset_type
        description: "The classified type of the matched spatial asset (e.g., speed_camera, toll_gantry)."
      - name: asset_maxspeed
        description: "The legal posted speed limit enforced at the exact physical spot of the asset."

      # Unified Spatial Mapping Fields (WGS 84 / GPS Decimal Degrees)
      - name: asset_longitude
        description: "The standalone, raw GPS longitude coordinate of the physical asset marker."
      - name: asset_latitude
        description: "The standalone, raw GPS latitude coordinate of the physical asset marker."
      - name: route_geometry_wkt
        description: "The complete polyline representing the road segment, fully transformed from SWEREF99 TM meters back into standard WGS84 GPS WKT format."
        tests:
          - not_null