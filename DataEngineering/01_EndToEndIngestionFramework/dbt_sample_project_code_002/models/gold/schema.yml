version: 2

models:
  - name: fct_realtime_traffic
    description: "The main fact table for traffic operations. Tracks real-time vehicle speeds and travel times linked by route and city hubs."
    columns:
      - name: traffic_fact_key
        description: "Primary Key: Unique MD5 hash combining the route_id and metrics_measured_at timestamp."
        tests:
          - unique
          - not_null

      - name: route_key
        description: "Foreign Key: Connects directly to dim_routes."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_routes')
                field: route_key

      - name: city_key
        description: "Foreign Key: Connects directly to dim_weather."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_weather')
                field: city_key

      - name: live_speed_kmh
        description: "The current recorded velocity of traffic on the route in km/h."

      - name: travel_time_seconds
        description: "The estimated duration to complete the route segment in seconds."

      - name: traffic_status
        description: "Raw traffic flow status categorized by Trafikverket (e.g., free flow, heavy)."

      - name: status_color
        description: "Dynamic mapping classification used by Tableau for rapid visual mapping alerts (Green, Yellow, Red)."

      - name: metrics_measured_at
        description: "The operational event timestamp from the Trafikverket API indicating when the traffic metrics were actually recorded."

      - name: dbt_loaded_at
        description: "The system timestamp indicating when the record was processed and loaded into the Snowflake Gold Layer by dbt."